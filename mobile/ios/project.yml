name: Sseudam
options:
  bundleIdPrefix: kr.sseudam
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ko
settings:
  base:
    DEVELOPMENT_TEAM: 967DUR6926
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Sseudam:
    type: application
    platform: iOS
    sources: [Sseudam]
    entitlements:
      path: Sseudam/Sseudam.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.kr.sseudam.app]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.kr.sseudam.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.sseudam.app
        PRODUCT_NAME: Sseudam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Sseudam/Info.plist
    info:
      path: Sseudam/Info.plist
      properties:
        CFBundleDisplayName: 쓰담
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 수업 중 학생 관찰 내용을 녹음하기 위해 마이크를 사용합니다.
        NSCameraUsageDescription: 컴퓨터의 쓰담과 연결할 때 QR 코드를 찍기 위해 카메라를 사용합니다.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: kr.sseudam.app
            CFBundleURLSchemes: [sseudam, seteuk]
        NSUbiquitousContainers:
          iCloud.kr.sseudam.app:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 쓰담
            NSUbiquitousContainerSupportedFolderLevels: None
